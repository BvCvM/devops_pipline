apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
  annotations:
    argocd.argoproj.io/sync-options: "Delete=false"
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/mysql
    type: DirectoryOrCreate
